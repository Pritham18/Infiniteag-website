<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Poor depleted sandy soil with minimal grass coverage">
<defs>
  <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A89060"/><stop offset="100%" stop-color="#8A7248"/></linearGradient>
</defs>
<!-- Sandy/dry soil base -->
<rect width="400" height="200" fill="url(#g5)"/>
<!-- Soil texture: irregular surface shapes -->
<ellipse cx="60" cy="80" rx="50" ry="22" fill="#987040" opacity=".4"/>
<ellipse cx="180" cy="65" rx="65" ry="20" fill="#A07848" opacity=".35"/>
<ellipse cx="310" cy="88" rx="55" ry="24" fill="#987040" opacity=".38"/>
<ellipse cx="380" cy="55" rx="40" ry="18" fill="#A07848" opacity=".32"/>
<!-- Sandy/crumbly soil texture: aggregate clusters -->
<circle cx="30" cy="110" r="6" fill="#786030" opacity=".4"/><circle cx="48" cy="104" r="5" fill="#7A6232" opacity=".38"/>
<circle cx="65" cy="115" r="7" fill="#786030" opacity=".4"/><circle cx="82" cy="108" r="5" fill="#7A6232" opacity=".38"/>
<circle cx="100" cy="120" r="6" fill="#786030" opacity=".4"/><circle cx="118" cy="112" r="5" fill="#7A6232" opacity=".35"/>
<circle cx="145" cy="105" r="6" fill="#786030" opacity=".38"/><circle cx="162" cy="115" r="7" fill="#7A6232" opacity=".4"/>
<circle cx="185" cy="108" r="5" fill="#786030" opacity=".35"/><circle cx="202" cy="118" r="6" fill="#7A6232" opacity=".38"/>
<circle cx="240" cy="112" r="7" fill="#786030" opacity=".4"/><circle cx="258" cy="104" r="5" fill="#7A6232" opacity=".38"/>
<circle cx="278" cy="118" r="6" fill="#786030" opacity=".4"/><circle cx="298" cy="110" r="5" fill="#7A6232" opacity=".35"/>
<circle cx="320" cy="122" r="7" fill="#786030" opacity=".4"/><circle cx="342" cy="112" r="5" fill="#7A6232" opacity=".38"/>
<circle cx="362" cy="106" r="6" fill="#786030" opacity=".4"/><circle cx="382" cy="118" r="5" fill="#7A6232" opacity=".35"/>
<!-- Small pebbles/aggregate in soil -->
<ellipse cx="38" cy="135" rx="8" ry="5" fill="#6A5828" opacity=".35"/>
<ellipse cx="90" cy="140" rx="7" ry="4" fill="#6A5828" opacity=".32"/>
<ellipse cx="155" cy="132" rx="9" ry="5" fill="#6A5828" opacity=".35"/>
<ellipse cx="220" cy="138" rx="7" ry="4" fill="#6A5828" opacity=".3"/>
<ellipse cx="285" cy="142" rx="8" ry="5" fill="#6A5828" opacity=".35"/>
<ellipse cx="348" cy="135" rx="9" ry="4" fill="#6A5828" opacity=".32"/>
<!-- Very sparse, struggling grass clumps -->
<g stroke-linecap="round" fill="none">
<!-- Clump 1 – far left -->
<path d="M15,200 Q14,182 18,168" stroke="#8A9040" stroke-width="1.9"/>
<path d="M24,200 Q26,180 22,166" stroke="#909648" stroke-width="1.7"/>
<path d="M33,200 Q31,183 37,168" stroke="#8A9040" stroke-width="1.9"/>
<!-- Wide bare gap -->
<!-- Clump 2 -->
<path d="M92,200 Q90,181 96,166" stroke="#8A9040" stroke-width="1.9"/>
<path d="M102,200 Q104,180 100,165" stroke="#909648" stroke-width="1.7"/>
<!-- Wide bare gap -->
<!-- Clump 3 – centre -->
<path d="M180,200 Q178,182 184,167" stroke="#8A9040" stroke-width="1.9"/>
<path d="M190,200 Q192,180 188,165" stroke="#909648" stroke-width="1.7"/>
<path d="M200,200 Q198,183 204,168" stroke="#8A9040" stroke-width="1.9"/>
<!-- Wide bare gap -->
<!-- Clump 4 -->
<path d="M278,200 Q276,181 282,166" stroke="#8A9040" stroke-width="1.9"/>
<path d="M288,200 Q290,180 286,165" stroke="#909648" stroke-width="1.7"/>
<!-- Wide bare gap -->
<!-- Clump 5 – far right -->
<path d="M368,200 Q366,181 372,166" stroke="#8A9040" stroke-width="1.9"/>
<path d="M380,200 Q382,180 378,165" stroke="#909648" stroke-width="1.7"/>
<path d="M392,200 Q390,182 396,167" stroke="#8A9040" stroke-width="1.9"/>
</g>
<!-- Exposed root fragments in surface soil -->
<path d="M50,155 Q70,148 95,152" stroke="#A08850" stroke-width="1.5" fill="none" opacity=".45"/>
<path d="M200,160 Q228,153 252,158" stroke="#A08850" stroke-width="1.5" fill="none" opacity=".42"/>
<path d="M310,157 Q335,150 362,155" stroke="#A08850" stroke-width="1.5" fill="none" opacity=".4"/>
</svg>
<ellipse cx="60" cy="79" rx="58" ry="19" fill="#4E5E2A" opacity=".5"/>
<ellipse cx="185" cy="75" rx="72" ry="23" fill="#445428" opacity=".48"/>
<ellipse cx="330" cy="77" rx="68" ry="22" fill="#506030" opacity=".45"/>
<ellipse cx="450" cy="79" rx="52" ry="18" fill="#4A5828" opacity=".48"/>

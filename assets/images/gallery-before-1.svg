<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Before: patchy weedy lawn in Bluffton SC">
<defs>
  <linearGradient id="sk1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8C4AE"/><stop offset="100%" stop-color="#DEDAD0"/></linearGradient>
  <linearGradient id="gd1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#767040"/><stop offset="100%" stop-color="#5C5630"/></linearGradient>
</defs>
<rect width="480" height="240" fill="url(#sk1)"/>
<rect y="78" width="480" height="162" fill="url(#gd1)"/>

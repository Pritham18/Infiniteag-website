<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Lawn pest damage showing irregular yellowing and spongy turf">
<defs>
  <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A7030"/><stop offset="100%" stop-color="#385A22"/></linearGradient>
</defs>
<rect width="400" height="200" fill="url(#g4)"/>
<!-- Yellowing damage patches (grub/billbug damage pattern) -->
<ellipse cx="80" cy="80" rx="62" ry="38" fill="#B09820" opacity=".55"/>
<ellipse cx="78" cy="78" rx="48" ry="28" fill="#C0A828" opacity=".48"/>
<ellipse cx="240" cy="95" rx="70" ry="40" fill="#AC9418" opacity=".52"/>
<ellipse cx="238" cy="93" rx="54" ry="30" fill="#BCAA20" opacity=".45"/>
<ellipse cx="360" cy="75" rx="48" ry="32" fill="#B09820" opacity=".5"/>
<ellipse cx="358" cy="73" rx="36" ry="24" fill="#C0A828" opacity=".44"/>
<!-- Spongy lifted turf patches (dead root zone) -->
<ellipse cx="140" cy="148" rx="45" ry="22" fill="#987830" opacity=".5"/>
<ellipse cx="290" cy="155" rx="38" ry="18" fill="#907020" opacity=".48"/>
<!-- Healthy grass (contrast with damage) -->
<g stroke-width="2" fill="none" stroke-linecap="round" opacity=".85">
<path d="M5,200 Q4,179 9,163" stroke="#3A7030"/><path d="M16,200 Q18,177 14,161" stroke="#448040"/>
<path d="M28,200 Q26,180 32,164" stroke="#3A7030"/><path d="M40,200 Q42,177 38,161" stroke="#448040"/>
<path d="M52,200 Q50,180 56,164" stroke="#3A7030"/>
</g>
<!-- Yellowed/stressed grass in damage zone -->
<g stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".8">
<path d="M76,200 Q74,180 80,163" stroke="#B0A030"/><path d="M89,200 Q91,178 87,162" stroke="#A89828"/>
<path d="M102,200 Q100,180 106,163" stroke="#B0A030"/><path d="M115,200 Q117,178 113,162" stroke="#A89828"/>
<path d="M234,200 Q232,180 238,163" stroke="#B0A030"/><path d="M248,200 Q250,178 246,162" stroke="#A89828"/>
<path d="M262,200 Q260,180 266,163" stroke="#B0A030"/><path d="M276,200 Q278,178 274,162" stroke="#A89828"/>
</g>
<!-- Healthy grass right side -->
<g stroke-width="2" fill="none" stroke-linecap="round" opacity=".85">
<path d="M170,200 Q168,179 174,163" stroke="#3A7030"/><path d="M184,200 Q186,177 182,161" stroke="#448040"/>
<path d="M198,200 Q196,180 202,164" stroke="#3A7030"/><path d="M212,200 Q214,177 210,161" stroke="#448040"/>
</g>
<!-- Dead/pulled up grass in damage center -->
<g stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6">
<path d="M128,200 Q130,186 125,175" stroke="#988840"/>
<path d="M145,200 Q143,185 148,173" stroke="#A09040"/>
<path d="M162,200 Q164,186 160,175" stroke="#988840"/>
</g>
<!-- Small soil disturbance marks (activity below surface, abstract) -->
<ellipse cx="82" cy="80" rx="8" ry="4" fill="#6A5820" opacity=".35"/>
<ellipse cx="244" cy="95" rx="9" ry="4" fill="#6A5820" opacity=".32"/>
<ellipse cx="362" cy="76" rx="7" ry="3" fill="#6A5820" opacity=".3"/>
<!-- More healthy grass right -->
<g stroke-width="2" fill="none" stroke-linecap="round" opacity=".85">
<path d="M310,200 Q308,179 314,163" stroke="#3A7030"/><path d="M324,200 Q326,177 322,161" stroke="#448040"/>
<path d="M338,200 Q336,180 342,164" stroke="#3A7030"/><path d="M352,200 Q354,177 350,161" stroke="#448040"/>
<path d="M366,200 Q364,180 370,164" stroke="#3A7030"/><path d="M380,200 Q382,177 378,161" stroke="#448040"/>
<path d="M394,200 Q392,180 398,164" stroke="#3A7030"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="After: clean mulched beds with crisp edges, Hilton Head Island SC">
<defs>
  <linearGradient id="sk6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#86C8EC"/><stop offset="100%" stop-color="#C4E4F4"/></linearGradient>
  <linearGradient id="gd6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2C6A2A"/><stop offset="100%" stop-color="#224E20"/></linearGradient>
  <linearGradient id="mulch" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6A4E30"/><stop offset="100%" stop-color="#503A22"/></linearGradient>
</defs>
<rect width="480" height="240" fill="url(#sk6)"/>
<!-- Same house facade, now bright/clean -->
<rect x="0" y="0" width="480" height="88" fill="#E0D8C4" opacity=".55"/>
<rect x="0" y="82" width="480" height="6" fill="#D0C8B0" opacity=".5"/>
<!-- Windows -->
<rect x="48" y="22" width="52" height="38" fill="#B8D0DC" opacity=".55" rx="2"/>
<rect x="50" y="24" width="24" height="38" fill="#A8C4D4" opacity=".5" rx="1"/>
<rect x="188" y="18" width="60" height="42" fill="#B8D0DC" opacity=".55" rx="2"/>
<rect x="190" y="20" width="28" height="42" fill="#A8C4D4" opacity=".5" rx="1"/>
<rect x="340" y="22" width="52" height="38" fill="#B8D0DC" opacity=".55" rx="2"/>
<rect x="342" y="24" width="24" height="38" fill="#A8C4D4" opacity=".5" rx="1"/>
<!-- Clean lawn behind bed -->
<rect y="88" width="480" height="55" fill="url(#gd6)" opacity=".85"/>
<!-- Neatly trimmed shrubs: rounded, tidy -->
<ellipse cx="90" cy="100" rx="65" ry="30" fill="#285228" opacity=".88"/>
<ellipse cx="90" cy="96" rx="52" ry="22" fill="#345E34" opacity=".8"/>
<!-- Clean top edge (trimmed flat) -->
<rect x="28" y="70" width="125" height="30" fill="#285228" opacity=".7" rx="4"/>
<!-- Middle shrub group, neatly shaped -->
<ellipse cx="255" cy="102" rx="70" ry="30" fill="#2A5A28" opacity=".85"/>
<ellipse cx="255" cy="98" rx="56" ry="22" fill="#326032" opacity=".78"/>
<rect x="186" y="70" width="138" height="32" fill="#285228" opacity=".68" rx="4"/>
<!-- Right shrubs, tidy -->
<ellipse cx="418" cy="100" rx="60" ry="28" fill="#285228" opacity=".88"/>
<ellipse cx="418" cy="96" rx="48" ry="21" fill="#345E34" opacity=".8"/>
<rect x="360" y="71" width="116" height="29" fill="#285228" opacity=".7" rx="4"/>
<!-- Clean fresh mulch bed with crisp edging -->
<rect y="133" width="480" height="107" fill="url(#mulch)"/>
<!-- Mulch texture: parallel subtle lines -->
<line x1="0" y1="145" x2="480" y2="145" stroke="#7A5A38" stroke-width="1" opacity=".25"/>
<line x1="0" y1="158" x2="480" y2="158" stroke="#7A5A38" stroke-width="1" opacity=".22"/>
<line x1="0" y1="171" x2="480" y2="171" stroke="#7A5A38" stroke-width="1" opacity=".2"/>
<line x1="0" y1="184" x2="480" y2="184" stroke="#7A5A38" stroke-width="1" opacity=".2"/>
<line x1="0" y1="197" x2="480" y2="197" stroke="#7A5A38" stroke-width="1" opacity=".18"/>
<line x1="0" y1="210" x2="480" y2="210" stroke="#7A5A38" stroke-width="1" opacity=".18"/>
<!-- Crisp edging line between mulch and grass -->
<rect y="132" width="480" height="3" fill="#4A3820" opacity=".7"/>
<!-- Accent plants in bed: two small ornamentals -->
<g transform="translate(155,142)">
  <ellipse cx="0" cy="-12" rx="16" ry="18" fill="#305030" opacity=".9"/>
  <ellipse cx="0" cy="-14" rx="10" ry="12" fill="#406040" opacity=".8"/>
  <rect x="-3" y="-4" width="6" height="12" fill="#2A3A20" opacity=".7"/>
</g>
<g transform="translate(325,140)">
  <ellipse cx="0" cy="-12" rx="18" ry="20" fill="#2E502E" opacity=".9"/>
  <ellipse cx="0" cy="-15" rx="11" ry="13" fill="#3E6038" opacity=".8"/>
  <rect x="-3" y="-4" width="6" height="12" fill="#2A3A20" opacity=".7"/>
</g>
<!-- Lawn edge with crisp grass border -->
<g stroke-width="2" fill="none" stroke-linecap="round">
<path d="M5,133 Q4,122 8,115" stroke="#2E7034"/><path d="M18,133 Q20,120 16,113" stroke="#347838"/>
<path d="M32,133 Q30,121 36,114" stroke="#2E7034"/><path d="M46,133 Q48,120 44,113" stroke="#347838"/>
<path d="M60,133 Q58,121 64,114" stroke="#2E7034"/><path d="M74,133 Q76,120 72,113" stroke="#347838"/>
<path d="M142,133 Q140,122 146,115" stroke="#2E7034"/><path d="M156,133 Q158,120 154,113" stroke="#347838"/>
<path d="M282,133 Q280,122 286,115" stroke="#2E7034"/><path d="M296,133 Q298,120 294,113" stroke="#347838"/>
<path d="M382,133 Q380,122 386,115" stroke="#2E7034"/><path d="M396,133 Q398,120 394,113" stroke="#347838"/>
<path d="M450,133 Q448,122 454,115" stroke="#2E7034"/><path d="M464,133 Q466,120 462,113" stroke="#347838"/>
</g>
</svg>